name: RSS calibration draft

on:
  push:
    paths: ['experiments/rss-calibration/**', '.github/workflows/rss-calibration.yml']
  pull_request:
    paths: ['experiments/rss-calibration/**', '.github/workflows/rss-calibration.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/rss-calibration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/rss-calibration/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python make_fixture.py data/synthetic.csv
      - run: python calibrate.py data/synthetic.csv --out output/synthetic --data-kind synthetic --source "make_fixture.py; seed 17"
